<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Celltac G PPM — إدارة الأجهزة</title><link rel="stylesheet" href="assets/style.css?v=20261006-deviceedit1"><style>.db-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.db-nav .active{background:#0f6673;color:#fff}.page-title{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.table-wrap{overflow-x:auto}.actions{white-space:nowrap}.danger{background:#b42318!important;color:#fff!important}.hint{margin:8px 0;color:#64748b;font-size:12px}</style></head><body><header class="header"><div class="brand">🖥️ إدارة الأجهزة</div><div class="userbar"><span id="who"></span><a class="btn btn-light" href="database.html?v=20261006-finaldb">🗄️ إدارة قاعدة البيانات</a><a class="btn btn-light" href="manager.html">المدير</a><button class="btn btn-light" onclick="logout()">خروج</button></div></header><div class="container">
<div class="db-nav"><a class="btn active" href="database-devices.html">🖥️ الأجهزة</a><a class="btn" href="database-visits.html">📋 الزيارات</a><a class="btn" href="database-engineers.html">👨‍🔧 المهندسون</a></div>
<div class="card"><div class="page-title"><div><h2>🖥️ جدول الأجهزة</h2><div class="small">إضافة وتعديل وحذف وعرض جميع الأجهزة.</div></div><div class="actions"><button class="btn btn-primary" onclick="openDeviceForm()">➕ إضافة جهاز</button> <button class="btn" onclick="$('excelFile').click()">📥 إضافة من Excel</button> <button class="btn" onclick="downloadTemplate()">📄 نموذج Excel</button> <button class="btn" onclick="exportDevices()">📊 استخراج الحصر</button><input id="excelFile" type="file" accept=".xlsx,.xls,.csv" style="display:none" onchange="importDevices(this)"></div></div><div class="hint">يمكن استيراد حتى 1000 جهاز. الأعمدة المطلوبة: Serial Number و Hospital.</div><div id="excelMsg" class="msg"></div><div id="deviceForm" style="display:none;margin:14px 0;padding:14px;background:#f7f9fb;border-radius:10px"><h3 id="deviceFormTitle">إضافة جهاز</h3><div class="filters"><div><label>Serial Number</label><input id="dSerial"></div><div><label>المستشفى</label><input id="dHospital"></div><div><label>المحافظة</label><input id="dGov"></div><div><label>تاريخ التركيب</label><input id="dInstall" type="date"></div></div><button class="btn btn-primary" onclick="saveDevice()">حفظ</button> <button class="btn" onclick="closeDeviceForm()">إلغاء</button></div><div class="table-wrap"><table><thead><tr><th>Serial</th><th>المستشفى</th><th>المحافظة</th><th>تاريخ التركيب</th><th>إجراءات</th></tr></thead><tbody id="devicesBody"></tbody></table></div></div><div id="msg" class="msg"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js?v=20261006-gov33"></script><script src="js/common.js?v=20261006-deviceedit1"></script><script>let profile,devices=[],editingDevice=null;const $=id=>document.getElementById(id);(async()=>{profile=await requireRole('manager');if(!profile)return;$('who').textContent=profile.full_name;await load()})();async function call(action,body={}){const{data:{session},error}=await sb.auth.getSession();if(error||!session)throw new Error('انتهت جلسة المدير.');const r=await fetch(SUPABASE_URL+'/functions/v1/manage-data',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':SUPABASE_ANON_KEY},body:JSON.stringify({action,...body})});const t=await r.text();let j={};try{j=JSON.parse(t)}catch(e){j={error:t}}if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}async function load(){try{const r=await call('list_devices');devices=r.devices||[];render()}catch(e){message(e.message)}}function message(t,ok=false){$('msg').className='msg '+(ok?'ok':'err');$('msg').textContent=t}function excelMessage(t,ok=false){$('excelMsg').className='msg '+(ok?'ok':'err');$('excelMsg').textContent=t}function render(){$('devicesBody').innerHTML=devices.length?devices.map(d=>'<tr><td><b>'+esc(d.serial_number)+'</b></td><td>'+esc(d.hospital_name)+'</td><td>'+esc(d.governorate||'—')+'</td><td>'+esc(d.installation_date||'—')+'</td><td><button class="btn" onclick="editDevice(\''+d.id+'\')">✏️ تعديل</button> <button class="btn danger" onclick="deleteDevice(\''+d.id+'\')">🗑️ حذف</button></td></tr>').join(''):'<tr><td colspan="5">لا توجد أجهزة.</td></tr>'}function openDeviceForm(){editingDevice=null;$('deviceFormTitle').textContent='إضافة جهاز';['dSerial','dHospital','dGov','dInstall'].forEach(x=>$(x).value='');$('deviceForm').style.display='block';scrollTo(0,0)}function closeDeviceForm(){$('deviceForm').style.display='none'}function editDevice(id){const d=devices.find(x=>x.id===id);if(!d)return;editingDevice=id;$('deviceFormTitle').textContent='تعديل بيانات الجهاز';$('dSerial').value=d.serial_number;$('dHospital').value=d.hospital_name;$('dGov').value=d.governorate||'';$('dInstall').value=d.installation_date||'';$('deviceForm').style.display='block';scrollTo(0,0)}async function saveDevice(){try{const body={serial_number:$('dSerial').value,hospital_name:$('dHospital').value,governorate:$('dGov').value,installation_date:$('dInstall').value};await call(editingDevice?'update_device':'create_device',editingDevice?{id:editingDevice,...body}:body);message(editingDevice?'✓ تم تعديل الجهاز.':'✓ تم إضافة الجهاز.',true);closeDeviceForm();await load()}catch(e){message('تعذر حفظ الجهاز: '+e.message)}}async function deleteDevice(id){const d=devices.find(x=>x.id===id);if(!d||!confirm('حذف الجهاز '+d.serial_number+' ؟'))return;try{await call('delete_device',{id});message('✓ تم حذف الجهاز.',true);await load()}catch(e){message('تعذر حذف الجهاز: '+e.message)}}function normalizeHeader(v){return String(v??'').trim().toLowerCase().replace(/[\\s_\\-]+/g,'')}function pick(row,names){const map={};Object.keys(row).forEach(k=>map[normalizeHeader(k)]=row[k]);for(const n of names){const v=map[normalizeHeader(n)];if(v!==undefined&&v!==null&&String(v).trim()!=='')return v}return ''}function excelDate(v){if(v===null||v===undefined||v==='')return '';if(typeof v==='number'){const d=XLSX.SSF.parse_date_code(v);if(d)return d.y+'-'+String(d.m).padStart(2,'0')+'-'+String(d.d).padStart(2,'0')}const s=String(v).trim();if(/^\\d{4}-\\d{1,2}-\\d{1,2}$/.test(s)){const[a,b,c]=s.split('-');return a+'-'+String(b).padStart(2,'0')+'-'+String(c).padStart(2,'0')}if(/^\\d{1,2}[\\/-]\\d{1,2}[\\/-]\\d{4}$/.test(s)){const[a,b,c]=s.split(/[\\/-]/);return c+'-'+String(b).padStart(2,'0')+'-'+String(a).padStart(2,'0')}return s}async function importDevices(input){const file=input.files?.[0];if(!file)return;try{excelMessage('جاري قراءة الملف...');const data=await file.arrayBuffer();const wb=XLSX.read(data,{type:'array',cellDates:true});const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{defval:'',raw:true});if(!rows.length){excelMessage('الملف فارغ.');return}const devicesToAdd=rows.map(r=>{let serial=String(pick(r,['Serial Number','Serial','serial_number','الرقم التسلسلي'])??'').trim();if(/^\\d+(\\.0)?$/.test(serial))serial=serial.replace(/\\.0$/,'').padStart(5,'0');return{serial_number:serial,hospital_name:String(pick(r,['Hospital','Hospital Name','hospital_name','المستشفى','اسم المستشفى'])??'').trim(),governorate:String(pick(r,['Governorate','governorate','المحافظة'])??'').trim(),installation_date:excelDate(pick(r,['Installation Date','installation_date','تاريخ التركيب']))}});const result=await call('bulk_create_devices',{devices:devicesToAdd});let t='✓ تم استيراد '+result.added_count+' جهاز.';if(result.skipped_count)t+=' تم تخطي '+result.skipped_count+' موجودين بالفعل.';if(result.error_count)t+=' يوجد '+result.error_count+' صف به خطأ.';excelMessage(t,result.error_count===0);await load();input.value=''}catch(e){excelMessage('تعذر استيراد الملف: '+e.message);input.value='' }}function exportDevices(){if(!devices.length){excelMessage('لا توجد أجهزة لاستخراجها.');return}const data=devices.map(d=>({'Serial Number':String(d.serial_number||''),'Hospital':d.hospital_name||'','Governorate':d.governorate||'','Installation Date':d.installation_date||''}));const ws=XLSX.utils.json_to_sheet(data);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Devices');XLSX.writeFile(wb,'Celltac_G_PPM_Devices_'+new Date().toISOString().slice(0,10)+'.xlsx')}function downloadTemplate(){const data=[{'Serial Number':'00001','Hospital':'اسم المستشفى','Governorate':'القاهرة','Installation Date':'2026-01-01'}];const ws=XLSX.utils.json_to_sheet(data);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Devices');XLSX.writeFile(wb,'Celltac_G_PPM_Devices_Template.xlsx')}</script></div></body></html>
