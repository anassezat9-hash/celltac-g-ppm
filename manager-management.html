<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Celltac G PPM — إدارة المديرين</title><link rel="stylesheet" href="assets/style.css?v=20261006-managerpassword1"></head><body><header class="header"><div class="brand">Celltac G PPM — إدارة المديرين</div><div class="userbar"><span id="who"></span><a class="btn btn-light" href="manager.html">↩ العودة للمدير</a><button class="btn btn-light" onclick="logout()">خروج</button></div></header><div class="container"><div class="card"><h2>🔐 إدارة المديرين</h2><div class="small">إضافة مدير جديد أو حذف مدير موجود.</div><div class="filters"><div><label>اسم المستخدم</label><input id="nu" autocomplete="off"></div><div><label>كلمة المرور للمدير</label><input id="np" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" minlength="4" autocomplete="new-password" placeholder="PIN من 4 أرقام"><label>تأكيد كلمة المرور</label><input id="np2" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" minlength="4" autocomplete="new-password" placeholder="أعد إدخال PIN"></div></div><button id="add" class="btn btn-primary">إضافة مدير</button><div id="adminMsg" class="msg"></div></div><div class="card"><h2>👥 المديرون الحاليون</h2><div id="managerList" class="small">جارٍ التحميل...</div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js?v=20261006-pinrestore1"></script><script src="js/common.js?v=20261006-pinrestore1"></script><script>let profile;const $=id=>document.getElementById(id);(async()=>{profile=await requireRole('manager');if(!profile)return;$('who').textContent=profile.full_name;await loadManagers()})();async function edge(action,body={}){const{data:{session},error}=await sb.auth.getSession();if(error||!session)throw new Error('انتهت جلسة المدير.');const r=await fetch(SUPABASE_URL+'/functions/v1/'+action,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':SUPABASE_ANON_KEY},body:JSON.stringify(body)});const t=await r.text();let j={};try{j=JSON.parse(t)}catch(e){j={error:t}}if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}async function loadManagers(){try{const r=await edge('manage-managers',{action:'list'});$('managerList').innerHTML=(r.managers||[]).map(m=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid #eee"><span><b>${esc(m.full_name||m.email)}</b><br><span class="small">${esc(m.email||'')}</span></span>${m.id===profile.id?'<span class="badge good">الحساب الحالي</span>':`<button class="btn" style="background:#b42318;color:#fff" onclick="removeManager('${m.id}','${esc(m.full_name||m.email)}')">حذف المدير</button>`}</div>`).join('')||'لا يوجد مديرون.'}catch(e){$('managerList').innerHTML='<span class="err">'+esc(e.message)+'</span>'}}window.removeManager=async(id,name)=>{if(!confirm('حذف المدير '+name+' ؟'))return;try{await edge('manage-managers',{action:'delete',id});$('adminMsg').className='msg ok';$('adminMsg').textContent='✓ تم حذف المدير.';await loadManagers()}catch(e){$('adminMsg').className='msg err';$('adminMsg').textContent='تعذر حذف المدير: '+e.message}};$('add').onclick=async()=>{const u=$('nu').value.trim(),p=$('np').value,p2=$('np2').value;if(!u||!p||!p2){$('adminMsg').className='msg err';$('adminMsg').textContent='أدخل اسم المستخدم والرقم السري وتأكيده.';return}if(!/^\d{4}$/.test(p)){$('adminMsg').className='msg err';$('adminMsg').textContent='PIN يجب أن يكون 4 أرقام.';return}if(p!==p2){$('adminMsg').className='msg err';$('adminMsg').textContent='الرقمان السريان غير متطابقين.';return}try{await edge('create-manager',{username:u,password:p,full_name:u});$('adminMsg').className='msg ok';$('adminMsg').textContent='✓ تم إنشاء حساب المدير بPIN الجديد.';$('nu').value='';$('np').value='';$('np2').value='';await loadManagers()}catch(e){$('adminMsg').className='msg err';$('adminMsg').textContent='تعذر إنشاء المدير: '+e.message}};</script></body></html>
