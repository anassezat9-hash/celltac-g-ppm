<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Celltac G PPM — متابعة الأجهزة</title><link rel="stylesheet" href="assets/style.css?v=overdue1"><style>
.overdue-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px;margin-top:16px}.overdue-item{border:1px solid #e7ebef;border-radius:14px;padding:13px;background:linear-gradient(135deg,#fff,#fbfcfd);box-shadow:0 2px 8px rgba(15,23,42,.05)}.overdue-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.overdue-serial{font-size:18px;font-weight:800}.overdue-hospital{margin-top:4px;font-weight:700;color:#24323d}.overdue-meta{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0;font-size:12px}.overdue-meta span{background:#f7f9fb;border-radius:9px;padding:8px}.overdue-meta b{display:block;margin-top:2px;color:#1f2937}.overdue-badge{display:inline-flex;align-items:center;gap:4px;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap}.overdue-badge.normal{background:#fff7ed;color:#b45309}.overdue-badge.urgent{background:#fef2f2;color:#b91c1c}.overdue-badge.critical{background:#fce7f3;color:#9d174d}.overdue-actions{display:flex;gap:7px;flex-wrap:wrap}.overdue-actions .btn{font-size:11px;padding:7px 10px}.empty{padding:22px;border:1px dashed #cbd5e1;border-radius:12px;background:#f8fafc;text-align:center}.summary{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.summary-box{flex:1;min-width:150px;background:#f7f9fb;border-radius:12px;padding:12px;text-align:center}.summary-box b{display:block;font-size:24px;margin-top:4px}.filters-bar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.filters-bar label{display:block;margin-bottom:5px}.filters-bar select,.filters-bar input{width:100%;box-sizing:border-box}@media(max-width:600px){.filters-bar{grid-template-columns:1fr}}
</style></head><body><header class="header"><div class="brand">Celltac G PPM — متابعة الأجهزة</div><div class="userbar"><a class="btn btn-light" href="manager.html">📊 لوحة المدير</a><span id="who"></span><button class="btn btn-light" onclick="logout()">خروج</button></div></header><div class="container"><div class="card"><div class="toolbar"><div><h2>⏰ متابعة الأجهزة المتأخرة</h2><div class="small">الأجهزة التي مرّ على آخر زيارة لها 30 يومًا أو أكثر، بالإضافة إلى الأجهزة التي لم تتم زيارتها أصلًا رغم مرور 30 يومًا على تركيبها.</div></div><div style="text-align:center"><b id="overdueCount" style="font-size:32px;display:block">0</b><span class="small">إجمالي المتابعة</span></div></div><div class="summary"><div class="summary-box">🆕 بدون أي زيارة<b id="neverCount">0</b></div><div class="summary-box">📅 آخر زيارة منذ 30+ يوم<b id="oldCount">0</b></div><div class="summary-box">🔴 متابعة 60+ يوم<b id="urgentCount">0</b></div></div><div class="filters-bar"><div><label>📍 المحافظة</label><select id="govFilter"><option value="">كل المحافظات</option></select></div><div><label>🔎 بحث</label><input id="searchFilter" placeholder="Serial أو اسم الجهة"></div></div><div id="msg" class="msg"></div><div id="overdueList" class="overdue-grid"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js?v=overdue1"></script><script src="js/common.js?v=overdue1"></script><script>
let profile,rows=[],allDevices=[],filteredRows=[];const $=id=>document.getElementById(id);
(async()=>{profile=await requireRole('manager');if(!profile)return;$('who').textContent=profile.full_name;await load()})();
async function load(){const[{data,error},{data:devs,error:devErr}]=await Promise.all([sb.from('visits').select('id,device_id,engineer_id,visit_date,created_at,devices:device_id(serial_number,hospital_name,hospital_type,governorate,installation_date),engineers:engineer_id(name)').order('visit_date',{ascending:false}).order('created_at',{ascending:false}),sb.from('devices').select('id,serial_number,hospital_name,hospital_type,governorate,installation_date').order('serial_number')]);if(error||devErr){$('msg').className='msg err';$('msg').textContent='تعذر تحميل البيانات: '+(error||devErr).message;return}allDevices=devs||[];const latest={};(data||[]).forEach(v=>{const d=v.devices||{};if(!latest[d.serial_number])latest[d.serial_number]={...v,serial_number:d.serial_number,hospital_name:d.hospital_name||'',hospital_type:d.hospital_type||'',governorate:d.governorate||'',installation_date:d.installation_date||'',engineer_name:(v.engineers||{}).name||''}});const today=new Date();today.setHours(0,0,0,0);const visited=Object.values(latest).map(r=>{const d=new Date(r.visit_date+'T00:00:00');return{...r,days:Math.floor((today-d)/86400000),kind:'old'}}).filter(r=>r.visit_date&&r.days>=30);const never=allDevices.filter(d=>!latest[d.serial_number]).map(d=>{const x=d.installation_date?new Date(d.installation_date+'T00:00:00'):null;return{...d,days:x?Math.floor((today-x)/86400000):0,kind:'never'}}).filter(d=>d.installation_date&&d.days>=30);rows=[...visited,...never].sort((a,b)=>b.days-a.days);fillGovernors();$('overdueCount').textContent=rows.length;$('neverCount').textContent=never.length;$('oldCount').textContent=visited.length;$('urgentCount').textContent=rows.filter(r=>r.days>=60).length;applyFilters()}
function fillGovernors(){const govs=[...new Set(rows.map(r=>String(r.governorate||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar'));$('govFilter').innerHTML='<option value="">كل المحافظات</option>'+govs.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join('')}function applyFilters(){const g=$('govFilter').value.toLowerCase(),q=$('searchFilter').value.trim().toLowerCase();filteredRows=rows.filter(r=>(!g||String(r.governorate||'').toLowerCase()===g)&&(!q||[r.serial_number,r.hospital_name].some(x=>String(x||'').toLowerCase().includes(q))));$('overdueCount').textContent=filteredRows.length;render()}function render(){$('overdueList').innerHTML=filteredRows.length?rows.map(r=>{const level=r.days>=90?'critical':r.days>=60?'urgent':'normal';const label=r.kind==='never'?'🆕 لم تتم زيارة':r.days>=90?'⚠ متابعة عاجلة':r.days>=60?'🔴 متابعة مهمة':'🟠 يحتاج متابعة';const date=r.kind==='never'?'لم تتم أي زيارة':r.visit_date;const duration=r.kind==='never'?'منذ التركيب: '+r.days+' يوم':'منذ آخر زيارة: '+r.days+' يوم';return `<div class="overdue-item"><div class="overdue-top"><div><div class="overdue-serial">#${esc(r.serial_number)}</div><div class="overdue-hospital">${esc(r.hospital_name||'جهة غير مسجلة')}</div></div><span class="overdue-badge ${level}">${label}</span></div><div class="overdue-meta"><span>📅 آخر زيارة<b>${esc(date)}</b></span><span>⏱ المدة<b>${esc(duration)}</b></span><span>📍 المحافظة<b>${esc(r.governorate||'—')}</b></span><span>👨‍🔧 المهندس<b>${r.kind==='never'?'—':esc(r.engineer_name||'—')}</b></span></div><div class="overdue-actions"><button class="btn btn-primary" onclick="openInManager('${esc(r.serial_number)}')">📋 فتح في سجل الزيارات</button><button class="btn" onclick="navigator.clipboard?.writeText('${esc(r.serial_number)}')">📌 نسخ Serial</button></div></div>`}).join(''):'<div class="empty" style="grid-column:1/-1">✅ لا توجد حاليًا أجهزة تحتاج متابعة بعد مرور 30 يومًا.</div>'}
function openInManager(serial){location.href='manager.html#serial='+encodeURIComponent(serial)}
</script></body></html><script>document.getElementById('govFilter').onchange=applyFilters;document.getElementById('searchFilter').oninput=applyFilters;</script>
