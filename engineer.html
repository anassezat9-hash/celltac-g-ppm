<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Celltac G PPM</title><link rel="stylesheet" href="assets/style.css"></head><body><header class="header"><div class="brand">Celltac G PPM</div><div class="userbar"><span id="who"></span><button class="btn btn-light" onclick="logout()">خروج</button></div></header><div class="container"><div class="card" style="max-width:680px;margin:auto"><h2>👨‍🔧 تسجيل زيارة</h2><label>Serial Number</label><input id="serial" list="serials" placeholder="اكتب رقم المسلسل"><datalist id="serials"></datalist><div id="info" class="small" style="background:#eff8fa;padding:12px;border-radius:10px;margin-top:10px"></div><label>تاريخ الزيارة</label><input id="date" type="date"><label>Total Count</label><input id="count" type="number" min="0" inputmode="numeric"><label>حالة الجهاز</label><select id="status"><option>يعمل بشكل جيد</option><option>يحتاج متابعة</option><option>عطل</option><option>عدم توافر محاليل</option></select><div id="partsBox" style="display:none"><label>قطع الغيار المطلوبة</label><input id="parts"></div><button id="save" class="btn btn-primary save">تسجيل الزيارة</button><div id="msg" class="msg"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/common.js"></script><script>let profile,device;const serial=document.getElementById('serial'),info=document.getElementById('info'),date=document.getElementById('date'),count=document.getElementById('count'),status=document.getElementById('status'),parts=document.getElementById('parts'),partsBox=document.getElementById('partsBox'),msg=document.getElementById('msg');date.value=new Date().toISOString().slice(0,10);(async()=>{profile=await requireRole('engineer');if(!profile)return;who.textContent=profile.full_name;const{data,error}=await sb.from('devices').select('serial_number').order('serial_number');if(!error)document.getElementById('serials').innerHTML=(data||[]).map(d=>`<option value="${esc(d.serial_number)}"></option>`).join('')})();async function lookup(){const s=serial.value.trim();if(!s){device=null;info.textContent='';return}const{data,error}=await sb.from('devices').select('id,serial_number,hospital_name,governorate,installation_date').eq('serial_number',s).single();if(error||!data){device=null;info.textContent='الجهاز غير موجود.';return}device=data;info.innerHTML=`<b>المستشفى:</b> ${esc(data.hospital_name)}<br><b>المحافظة:</b> ${esc(data.governorate||'غير مسجل')}<br><b>تاريخ التركيب:</b> ${esc(data.installation_date||'غير مسجل')}`}serial.onchange=lookup;serial.onblur=lookup;status.onchange=()=>partsBox.style.display=status.value==='عطل'?'block':'none';document.getElementById('save').onclick=async()=>{msg.className='msg';msg.textContent='';if(!device||!date.value||count.value===''){msg.className='msg err';msg.textContent='أكمل البيانات واختر Serial صحيحًا.';return}const p={device_id:device.id,engineer_id:profile.engineer_id,visit_date:date.value,total_count:Number(count.value),device_status:status.value,spare_parts:status.value==='عطل'?parts.value.trim():null};const{error}=await sb.from('visits').insert(p);if(error){msg.className='msg err';msg.textContent='تعذر تسجيل الزيارة: '+error.message;return}msg.className='msg ok';msg.textContent='✓ تم تسجيل الزيارة بنجاح.';serial.value='';count.value='';parts.value='';info.textContent='';device=null}</script></body></html>
