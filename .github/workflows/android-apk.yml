name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CelltacGPPM-Android/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Clean build
        working-directory: CelltacGPPM-Android
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Verify APK is a real installable package
        shell: bash
        run: |
          set -euo pipefail
          APK="CelltacGPPM-Android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "APK size: ${SIZE} bytes"
          test "$SIZE" -gt 1000
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='com.celltac.gppm'" /tmp/apk-badging.txt
          grep -q "launchable-activity" /tmp/apk-badging.txt
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          unzip -t "$APK" >/tmp/apk-zip-test.txt
          tail -n 2 /tmp/apk-zip-test.txt

      - name: Rename verified APK
        shell: bash
        run: |
          cp CelltacGPPM-Android/app/build/outputs/apk/debug/app-debug.apk CelltacGPPM-v1.0.2-debug.apk

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: CelltacGPPM-v1.0.2-verified-apk
          path: CelltacGPPM-v1.0.2-debug.apk
          if-no-files-found: error
