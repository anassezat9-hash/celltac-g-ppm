name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CelltacGPPM-Android/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: CelltacGPPM-Android
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CelltacGPPM-debug-apk
          path: CelltacGPPM-Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
