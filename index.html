<!doctype html><html lang="en" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Celltac G PPM</title><link rel="stylesheet" href="assets/style.css"></head><body><div class="login"><div class="login-card"><div class="login-title">Celltac G PPM</div><div class="login-sub">نظام متابعة زيارات وصيانة أجهزة Celltac G</div><label>User Type</label><select id="role"><option value="">— Select User Type —</option><option value="engineer">Engineer</option><option value="manager">Manager</option></select><label>Username</label><select id="user" disabled><option value="">— Select Username —</option></select><label>Password</label><div class="eye"><input id="p" type="password" placeholder="Password"><button type="button" onclick="toggle()">◉</button></div><button id="loginBtn" class="btn btn-primary save">Login</button><div id="m" class="msg"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/common.js"></script><script>const ENGINEERS=[['Anas','anas@celltac.local'],['Abdelrahman','abdelrahman@celltac.local'],['Mahmoud','mahmoud@celltac.local'],['Aya','aya@celltac.local'],['Kholoud','kholoud@celltac.local'],['Mohamed','mohamed@celltac.local'],['Rimon','rimon@celltac.local']];let managers=[['admin','admin@celltac.local']];const role=document.getElementById('role'),user=document.getElementById('user'),pass=document.getElementById('p'),msg=document.getElementById('m'),btn=document.getElementById('loginBtn');function fill(){user.innerHTML='<option value="">— Select Username —</option>';user.disabled=!role.value;(role.value==='engineer'?ENGINEERS:managers).forEach(x=>{const o=document.createElement('option');o.value=x[1];o.textContent=x[0];user.appendChild(o)})}role.onchange=fill;function toggle(){pass.type=pass.type==='password'?'text':'password'}async function loadManagers(){try{const{data,error}=await sb.rpc('get_login_managers');if(!error&&Array.isArray(data)&&data.length)managers=data.map(x=>[x.username||String(x.email||'').split('@')[0],x.email])}catch(e){}if(role.value==='manager')fill()}async function login(){msg.textContent='';if(!role.value||!user.value||!pass.value){msg.textContent='اختر المستخدم واكتب كلمة المرور.';return}btn.disabled=true;btn.textContent='Logging in...';try{const{data,error}=await sb.auth.signInWithPassword({email:user.value,password:pass.value});if(error)throw error;const{data:p,error:pe}=await sb.from('profiles').select('id,full_name,role,active,engineer_id').eq('id',data.user.id).single();if(pe||!p)throw new Error('لم يتم العثور على صلاحيات الحساب.');if(!p.active)throw new Error('هذا الحساب غير مفعل.');if(p.role!==role.value)throw new Error('نوع المستخدم لا يطابق صلاحية الحساب.');location.href=p.role==='manager'?'manager.html':'engineer.html'}catch(e){msg.textContent=e.message==='Invalid login credentials'?'Username أو Password غير صحيحة.':e.message}finally{btn.disabled=false;btn.textContent='Login'}}btn.onclick=login;fill();loadManagers();</script></body></html>
