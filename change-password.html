<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Celltac G PPM — تغيير كلمة المرور</title><link rel="stylesheet" href="assets/style.css?v=20261006-forcedchange1"></head><body><div class="login"><div class="login-card"><div class="login-title">تغيير كلمة المرور</div><div class="login-sub">لازم تغيّر كلمة المرور قبل استخدام النظام لأول مرة.</div><label>كلمة المرور الجديدة</label><input id="p1" type="password" autocomplete="new-password" minlength="6"><label>تأكيد كلمة المرور</label><input id="p2" type="password" autocomplete="new-password" minlength="6"><button id="save" class="btn btn-primary save">حفظ والدخول</button><div id="m" class="msg"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js?v=20261006-forcedchange1"></script><script>const $=id=>document.getElementById(id),db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);async function run(){const{data:{session}}=await db.auth.getSession();if(!session){location.href='index.html';return}}async function save(){const a=$('p1').value,b=$('p2').value;if(a.length<6){$('m').className='msg err';$('m').textContent='كلمة المرور يجب أن تكون 6 أحرف أو أرقام على الأقل.';return}if(a!==b){$('m').className='msg err';$('m').textContent='تأكيد كلمة المرور غير متطابق.';return}$('save').disabled=true;try{const{data:{session}}=await db.auth.getSession();const r=await fetch(SUPABASE_URL+'/functions/v1/complete-password-change',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':SUPABASE_ANON_KEY},body:JSON.stringify({password:a})});const j=await r.json();if(!r.ok)throw new Error(j.error||'تعذر تغيير كلمة المرور.');const{data:p}=await db.from('profiles').select('role,active').eq('id',session.user.id).single();if(!p?.active)throw new Error('الحساب غير مفعل.');location.href=p.role==='manager'?'manager.html':'engineer.html'}catch(e){$('m').className='msg err';$('m').textContent=e.message;$('save').disabled=false}}$('save').onclick=save;run();</script></body></html>
