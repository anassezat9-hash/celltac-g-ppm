<div class="card"><div class="page-title"><div><h2 style="margin-top:0">📍 فلترة الأجهزة حسب المحافظة</h2><div class="small">صفحة مستقلة لعرض أجهزة محافظة محددة بدون إضافة الفلتر إلى صفحة الأجهزة الرئيسية.</div></div></div>
<div class="filter-box"><div><label>المحافظة</label><select id="gov" onchange="render()"><option value="">— كل المحافظات —</option></select></div><div class="count" id="count">جاري التحميل...</div></div>
<div class="table-wrap"><table><thead><tr><th>Serial</th><th>المستشفى</th><th>المحافظة</th><th>تاريخ التركيب</th></tr></thead><tbody id="body"></tbody></table></div></div><div id="msg" class="msg"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js?v=20261006-dbpages2"></script><script src="js/common.js?v=20261006-fixdup1"></script>
<script>let profile,devices=[];const $=id=>document.getElementById(id);(async()=>{profile=await requireRole('manager');if(!profile)return;$('who').textContent=profile.full_name;await load()})();async function call(action,body={}){const{data:{session},error}=await sb.auth.getSession();if(error||!session)throw new Error('انتهت جلسة المدير.');const r=await fetch(SUPABASE_URL+'/functions/v1/manage-data',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':SUPABASE_ANON_KEY},body:JSON.stringify({action,...body})});const t=await r.text();let j={};try{j=JSON.parse(t)}catch(e){j={error:t}}if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}async function load(){try{const r=await call('list_devices');devices=r.devices||[];const gs=[...new Set(devices.map(d=>String(d.governorate||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar'));$('gov').innerHTML='<option value="">— كل المحافظات —</option>'+gs.map(g=>'<option value="'+esc(g)+'">'+esc(g)+'</option>').join('');render()}catch(e){$('msg').className='msg err';$('msg').textContent=e.message;$('count').textContent=''}}function render(){const g=$('gov').value;const list=g?devices.filter(d=>String(d.governorate||'').trim()===g):devices;$('count').textContent='عدد الأجهزة: '+list.length;$('body').innerHTML=list.length?list.map(d=>'<tr><td><b>'+esc(d.serial_number)+'</b></td><td>'+esc(d.hospital_name||'—')+'</td><td>'+esc(d.governorate||'—')+'</td><td>'+esc(d.installation_date||'—')+'</td></tr>').join(''):'<tr><td colspan="4" class="empty">لا توجد أجهزة في المحافظة المختارة.</td></tr>'}</script></div></body></html>
