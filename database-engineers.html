<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Celltac G PPM — إدارة المهندسين</title><link rel="stylesheet" href="assets/style.css?v=20261006-gov32"><style>.db-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.db-nav .active{background:#0f6673;color:#fff}.page-title{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.table-wrap{overflow-x:auto}.actions{white-space:nowrap}.danger{background:#b42318!important;color:#fff!important}.hint{margin:8px 0;color:#64748b;font-size:12px}</style></head><body><header class="header"><div class="brand">👨‍🔧 إدارة المهندسين</div><div class="userbar"><span id="who"></span><a class="btn btn-light" href="database.html?v=20261006-finaldb">🗄️ إدارة قاعدة البيانات</a><a class="btn btn-light" href="manager.html">المدير</a><button class="btn btn-light" onclick="logout()">خروج</button></div></header><div class="container">
<div class="db-nav"><a class="btn" href="database-devices.html">🖥️ الأجهزة</a><a class="btn" href="database-visits.html">📋 الزيارات</a><a class="btn active" href="database-engineers.html">👨‍🔧 المهندسون</a></div>
<div class="card"><div class="page-title"><div><h2>👨‍🔧 جدول المهندسين</h2><div class="small">عرض بيانات المهندسين وحالة الحساب وتاريخ الإنشاء.</div></div></div><div class="table-wrap"><table><thead><tr><th>الاسم</th><th>الحالة</th><th>تاريخ الإنشاء</th></tr></thead><tbody id="engineersBody"></tbody></table></div></div><div id="msg" class="msg"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js?v=20261006-gov32"></script><script src="js/common.js?v=20261006-fixdup1"></script><script>let profile;const $=id=>document.getElementById(id);(async()=>{profile=await requireRole('manager');if(!profile)return;$('who').textContent=profile.full_name;await load()})();async function call(action,body={}){const{data:{session},error}=await sb.auth.getSession();if(error||!session)throw new Error('انتهت جلسة المدير.');const r=await fetch(SUPABASE_URL+'/functions/v1/manage-data',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':SUPABASE_ANON_KEY},body:JSON.stringify({action,...body})});const t=await r.text();let j={};try{j=JSON.parse(t)}catch(e){j={error:t}}if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}async function load(){try{const r=await call('list_engineers');const a=r.engineers||[];$('engineersBody').innerHTML=a.length?a.map(e=>'<tr><td>'+esc(e.name)+'</td><td>'+(e.active?'نشط':'غير نشط')+'</td><td>'+esc(e.created_at?new Date(e.created_at).toLocaleDateString('ar-EG'):'—')+'</td></tr>').join(''):'<tr><td colspan="3">لا يوجد مهندسون.</td></tr>'}catch(e){$('msg').className='msg err';$('msg').textContent=e.message}}</script></div></body></html>
