<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Celltac G PPM — إدارة الزيارات</title><link rel="stylesheet" href="assets/style.css?v=20261006-gov32"><style>.db-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.db-nav .active{background:#0f6673;color:#fff}.page-title{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.table-wrap{overflow-x:auto}.actions{white-space:nowrap}.danger{background:#b42318!important;color:#fff!important}.hint{margin:8px 0;color:#64748b;font-size:12px}</style></head><body><header class="header"><div class="brand">📋 إدارة الزيارات</div><div class="userbar"><span id="who"></span><a class="btn btn-light" href="database.html">🗄️ إدارة قاعدة البيانات</a><a class="btn btn-light" href="manager.html">المدير</a><button class="btn btn-light" onclick="logout()">خروج</button></div></header><div class="container">
<div class="db-nav"><a class="btn" href="database-devices.html">🖥️ الأجهزة</a><a class="btn active" href="database-visits.html">📋 الزيارات</a><a class="btn" href="database-engineers.html">👨‍🔧 المهندسون</a></div>
<div class="card"><div class="page-title"><div><h2>📋 جدول الزيارات</h2><div class="small">إضافة وتعديل وحذف جميع الزيارات المسجلة.</div></div><button class="btn btn-primary" onclick="openVisitForm()">➕ إضافة زيارة</button></div><div id="visitForm" style="display:none;margin:14px 0;padding:14px;background:#f7f9fb;border-radius:10px"><h3 id="visitFormTitle">إضافة زيارة</h3><div class="filters"><div><label>الجهاز</label><select id="vDevice"></select></div><div><label>المهندس</label><select id="vEngineer"></select></div><div><label>تاريخ الزيارة</label><input id="vDate" type="date"></div><div><label>Total Count</label><input id="vCount" type="number" min="0"></div><div><label>حالة الجهاز</label><select id="vStatus"><option>يعمل بشكل جيد</option><option>يحتاج متابعة</option><option>عطل</option><option>عدم توافر محاليل</option></select></div><div><label>قطع الغيار</label><input id="vParts"></div></div><button class="btn btn-primary" onclick="saveVisit()">حفظ</button> <button class="btn" onclick="closeVisitForm()">إلغاء</button></div><div class="table-wrap"><table><thead><tr><th>Serial</th><th>المستشفى</th><th>التاريخ</th><th>المهندس</th><th>Total Count</th><th>الحالة</th><th>قطع الغيار</th><th>إجراءات</th></tr></thead><tbody id="visitsBody"></tbody></table></div></div><div id="msg" class="msg"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js?v=20261006-gov32"></script><script src="js/common.js?v=20261006-fixdup1"></script><script>let profile,devices=[],engineers=[],visits=[],editingVisit=null;const $=id=>document.getElementById(id);(async()=>{profile=await requireRole('manager');if(!profile)return;$('who').textContent=profile.full_name;await load()})();async function call(action,body={}){const{data:{session},error}=await sb.auth.getSession();if(error||!session)throw new Error('انتهت جلسة المدير.');const r=await fetch(SUPABASE_URL+'/functions/v1/manage-data',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':SUPABASE_ANON_KEY},body:JSON.stringify({action,...body})});const t=await r.text();let j={};try{j=JSON.parse(t)}catch(e){j={error:t}}if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}async function load(){try{const[d,e,v]=await Promise.all([call('list_devices'),call('list_engineers'),call('list_visits')]);devices=d.devices||[];engineers=e.engineers||[];visits=v.visits||[];render()}catch(e){message(e.message)}}function message(t,ok=false){$('msg').className='msg '+(ok?'ok':'err');$('msg').textContent=t}function render(){renderVisits();fillSelects()}function renderVisits(){$('visitsBody').innerHTML=visits.length?visits.map(v=>'<tr><td><b>'+esc(v.devices?.serial_number||'')+'</b></td><td>'+esc(v.devices?.hospital_name||'')+'</td><td>'+esc(v.visit_date)+'</td><td>'+esc(v.engineers?.name||'')+'</td><td>'+v.total_count+'</td><td>'+statusBadge(v.device_status)+'</td><td>'+esc(v.spare_parts||'—')+'</td><td><button class="btn" onclick="editVisit(\''+v.id+'\')">✏️ تعديل</button> <button class="btn danger" onclick="deleteVisit(\''+v.id+'\')">🗑️ حذف</button></td></tr>').join(''):'<tr><td colspan="8">لا توجد زيارات.</td></tr>'}function fillSelects(){$('vDevice').innerHTML='<option value="">— اختر الجهاز —</option>'+devices.map(d=>'<option value="'+d.id+'">'+esc(d.serial_number)+' — '+esc(d.hospital_name)+'</option>').join('');$('vEngineer').innerHTML='<option value="">— اختر المهندس —</option>'+engineers.filter(e=>e.active).map(e=>'<option value="'+e.id+'">'+esc(e.name)+'</option>').join('')}function openVisitForm(){editingVisit=null;$('visitFormTitle').textContent='إضافة زيارة';$('vDevice').value='';$('vEngineer').value='';$('vDate').value=new Date().toISOString().slice(0,10);$('vCount').value='';$('vStatus').value='يعمل بشكل جيد';$('vParts').value='';$('visitForm').style.display='block';scrollTo(0,0)}function closeVisitForm(){$('visitForm').style.display='none'}function editVisit(id){const v=visits.find(x=>x.id===id);if(!v)return;editingVisit=id;$('visitFormTitle').textContent='تعديل الزيارة';$('vDevice').value=v.device_id;$('vEngineer').value=v.engineer_id;$('vDate').value=v.visit_date;$('vCount').value=v.total_count;$('vStatus').value=v.device_status;$('vParts').value=v.spare_parts||'';$('visitForm').style.display='block';scrollTo(0,0)}async function saveVisit(){try{const body={device_id:$('vDevice').value,engineer_id:$('vEngineer').value,visit_date:$('vDate').value,total_count:Number($('vCount').value),device_status:$('vStatus').value,spare_parts:$('vParts').value};await call(editingVisit?'update_visit':'create_visit',editingVisit?{id:editingVisit,...body}:body);message(editingVisit?'✓ تم تعديل الزيارة.':'✓ تم إضافة الزيارة.',true);closeVisitForm();await load()}catch(e){message('تعذر حفظ الزيارة: '+e.message)}}async function deleteVisit(id){if(!confirm('حذف هذه الزيارة نهائيًا؟'))return;try{await call('delete_visit',{id});message('✓ تم حذف الزيارة.',true);await load()}catch(e){message('تعذر حذف الزيارة: '+e.message)}}</script></div></body></html>
